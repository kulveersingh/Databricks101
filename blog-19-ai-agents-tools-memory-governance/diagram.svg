<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#43544B"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0FA968"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0E8F8C"/>
    </marker>
  <pattern id="ks-pinstripe" width="9" height="9" patternUnits="userSpaceOnUse">
    <path d="M0,9 L9,0" stroke="#0A3527" stroke-width="1.4" stroke-opacity="0.055"/>
  </pattern>
  <pattern id="ks-dotgrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.7" fill="#0A3527" fill-opacity="0.07"/>
  </pattern>
  <filter id="ks-card-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A3527" flood-opacity="0.14"/>
  </filter>
</defs>

  <rect x="0" y="0" width="1400" height="980" fill="#FFFFFF"/>

  <text x="700" y="52" text-anchor="middle" font-size="34" font-weight="bold" fill="#1a1a1a">The Agent Loop</text>
  <rect x="640.0" y="68.0" width="120" height="6" rx="3" fill="#C49A1F" data-ks="title-rule"/><text x="700" y="82" text-anchor="middle" font-size="17" fill="#5A6A60">Plan → tool call → observe, with Unity Catalog tools, memory, and governance</text>

  <!-- User request in -->
  <rect x="40" y="110" width="320" height="90" rx="10" fill="#F0FAF8" stroke="#0E8F8C" stroke-width="2"/>
  <text x="200" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#2F3D36">User request</text>
  <text x="200" y="166" text-anchor="middle" font-size="13" fill="#64756C">"Draft my Midwest report"</text>
  <line x1="360" y1="155" x2="470" y2="155" stroke="#0E8F8C" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- The loop -->
  <rect x="490" y="110" width="560" height="330" rx="14" fill="#E9F7F0" stroke="#0FA968" stroke-width="2"/>
  <rect x="490" y="110" width="560" height="330" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="520" y="142" font-size="18" font-weight="bold" fill="#0FA968">THE LOOP</text>
  <text x="520" y="164" font-size="14" fill="#7E8B82">Runs until answer or iteration cap</text>

  <g font-size="15" fill="#2F3D36">
    <rect x="520" y="182" width="240" height="90" rx="10" fill="#FFFFFF" stroke="#0FA968" stroke-width="1.5" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="640" y="212" text-anchor="middle" font-weight="bold">1 · Plan</text>
    <text x="640" y="234" text-anchor="middle" font-size="13" fill="#64756C">LLM picks next action</text>

    <rect x="790" y="182" width="240" height="90" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="910" y="212" text-anchor="middle" font-weight="bold">2 · Tool call</text>
    <text x="910" y="234" text-anchor="middle" font-size="13" fill="#64756C">invokes a UC function</text>

    <rect x="790" y="300" width="240" height="90" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="910" y="330" text-anchor="middle" font-weight="bold">3 · Observe</text>
    <text x="910" y="352" text-anchor="middle" font-size="13" fill="#64756C">result returns to context</text>

    <rect x="520" y="300" width="240" height="90" rx="10" fill="#F4FAF7" stroke="#0FA968" stroke-width="1.5"/>
    <text x="640" y="330" text-anchor="middle" font-weight="bold" fill="#0FA968">4 · Answer / repeat</text>
    <text x="640" y="352" text-anchor="middle" font-size="13" fill="#64756C">done? respond : loop</text>
  </g>
  <line x1="760" y1="227" x2="786" y2="227" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="910" y1="272" x2="910" y2="296" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="345" x2="764" y2="345" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="296" x2="640" y2="272" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Answer out -->
  <line x1="640" y1="440" x2="640" y2="486" stroke="#0FA968" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="490" width="280" height="90" rx="10" fill="#F4FAF7" stroke="#0FA968" stroke-width="2"/>
  <text x="640" y="522" text-anchor="middle" font-size="15" font-weight="bold" fill="#2F3D36">Final answer</text>
  <text x="640" y="546" text-anchor="middle" font-size="13" fill="#64756C">draft saved for review</text>

  <!-- Tools -->
  <rect x="1090" y="110" width="270" height="330" rx="14" fill="#F0FAF8" stroke="#0E8F8C" stroke-width="2"/>
  <rect x="1090" y="110" width="270" height="330" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="1115" y="142" font-size="18" font-weight="bold" fill="#0E8F8C">TOOLS</text>
  <text x="1115" y="164" font-size="13" fill="#7E8B82">Unity Catalog functions</text>
  <g font-size="13" fill="#2F3D36">
    <rect x="1110" y="180" width="230" height="52" rx="8" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1225" y="210" text-anchor="middle" font-weight="bold">sales.weekly_by_segment</text>
    <rect x="1110" y="242" width="230" height="52" rx="8" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1225" y="272" text-anchor="middle" font-weight="bold">sales.vs_forecast</text>
    <rect x="1110" y="304" width="230" height="52" rx="8" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1225" y="334" text-anchor="middle" font-weight="bold">reports.draft_section</text>
    <rect x="1110" y="366" width="230" height="52" rx="8" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1225" y="396" text-anchor="middle" font-weight="bold">reports.save_draft</text>
  </g>
  <line x1="1030" y1="227" x2="1086" y2="206" stroke="#0E8F8C" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="1060" y="196" font-size="12" fill="#0E8F8C">calls</text>

  <!-- Memory -->
  <rect x="40" y="620" width="640" height="300" rx="14" fill="#E6F5F3" stroke="#0B6E6B" stroke-width="2"/>
  <rect x="40" y="620" width="640" height="300" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="70" y="652" font-size="18" font-weight="bold" fill="#0B6E6B">MEMORY</text>
  <text x="70" y="674" font-size="14" fill="#7E8B82">What the agent remembers</text>
  <g font-size="15" fill="#2F3D36">
    <rect x="70" y="692" width="580" height="96" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="360" y="720" text-anchor="middle" font-weight="bold">Short-term — run context</text>
    <text x="360" y="744" text-anchor="middle" font-size="13" fill="#64756C">request · tool calls · observations</text>
    <text x="360" y="766" text-anchor="middle" font-size="13" fill="#64756C">summarize, don't blindly append</text>
    <rect x="70" y="800" width="580" height="96" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="360" y="828" text-anchor="middle" font-weight="bold">Long-term — Delta / Vector Search</text>
    <text x="360" y="852" text-anchor="middle" font-size="13" fill="#64756C">"Midwest = these 12 states" · CFO preferences</text>
    <text x="360" y="874" text-anchor="middle" font-size="13" fill="#64756C">queried as just another tool call</text>
  </g>
  <path d="M 300 616 L 300 520 L 484 520 L 484 445" fill="none" stroke="#0B6E6B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="292" y="560" font-size="12" fill="#0B6E6B">reads</text>

  <!-- Governance -->
  <rect x="720" y="620" width="640" height="300" rx="14" fill="#E9F7F0" stroke="#0FA968" stroke-width="2"/>
  <rect x="720" y="620" width="640" height="300" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="750" y="652" font-size="18" font-weight="bold" fill="#0FA968">GOVERNANCE</text>
  <text x="750" y="674" font-size="14" fill="#7E8B82">Constraints are the feature</text>
  <g font-size="14" fill="#2F3D36">
    <rect x="750" y="692" width="580" height="62" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1040" y="718" text-anchor="middle" font-weight="bold">Permission inheritance</text>
    <text x="1040" y="740" text-anchor="middle" font-size="13" fill="#64756C">agent can't exceed the user's grants</text>
    <rect x="750" y="766" width="580" height="62" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1040" y="792" text-anchor="middle" font-weight="bold">Sandboxed tools · human approval</text>
    <text x="1040" y="814" text-anchor="middle" font-size="13" fill="#64756C">read-only default · can draft, can't send</text>
    <rect x="750" y="840" width="580" height="62" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1040" y="866" text-anchor="middle" font-weight="bold">Loop caps + audit logs</text>
    <text x="1040" y="888" text-anchor="middle" font-size="13" fill="#64756C">max 15 iterations · every call logged</text>
  </g>
  <line x1="830" y1="700" x2="830" y2="444" stroke="#0FA968" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="845" y="580" font-size="12" fill="#0FA968">enforces</text>
</svg>