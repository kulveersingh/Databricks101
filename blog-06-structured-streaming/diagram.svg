<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#64756C"/></marker><pattern id="ks-pinstripe" width="9" height="9" patternUnits="userSpaceOnUse">
    <path d="M0,9 L9,0" stroke="#0A3527" stroke-width="1.4" stroke-opacity="0.055"/>
  </pattern>
  <pattern id="ks-dotgrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.7" fill="#0A3527" fill-opacity="0.07"/>
  </pattern>
  <filter id="ks-card-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A3527" flood-opacity="0.14"/>
  </filter>
</defs>
<rect x="0" y="0" width="1400" height="800" fill="#FFFFFF"/>
<text x="700" y="40" font-family="DejaVu Sans, Verdana, sans-serif" font-size="22" text-anchor="middle" font-weight="bold" fill="#0A3527">Streaming pipeline with checkpointing (fraud scoring)</text>
<rect x="640.0" y="56.0" width="120" height="6" rx="3" fill="#C49A1F" data-ks="title-rule"/><rect x="40" y="120" width="200" height="100" rx="10" fill="#DFF0EC" stroke="#A9BFAE" stroke-width="1.5"/>
<text x="140" y="158" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#0A3527">Kafka</text>
<text x="140" y="182" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#64756C">authorizations</text>
<text x="140" y="202" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#64756C">keyed by txn id</text>
<line x1="240" y1="170" x2="290" y2="170" stroke="#64756C" stroke-width="2" marker-end="url(#ah)"/>
<rect x="290" y="100" width="280" height="140" rx="10" fill="#E9F7F0" stroke="#A9BFAE" stroke-width="1.5"/>
<rect x="290" y="100" width="280" height="140" rx="10" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="430" y="132" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#0A3527">Stream: features</text>
<text x="430" y="156" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#64756C">watermark: 10 min on event_ts</text>
<text x="430" y="178" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#64756C">windowed agg → state store</text>
<text x="430" y="200" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#64756C">card velocity features</text>
<line x1="570" y1="170" x2="620" y2="170" stroke="#64756C" stroke-width="2" marker-end="url(#ah)"/>
<rect x="620" y="100" width="280" height="140" rx="10" fill="#FAF0D7" stroke="#A9BFAE" stroke-width="1.5"/>
<rect x="620" y="100" width="280" height="140" rx="10" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="760" y="132" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#0A3527">foreachBatch</text>
<text x="760" y="156" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#64756C">score with fraud model</text>
<text x="760" y="178" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#64756C">MERGE into risk table</text>
<text x="760" y="200" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#64756C">idempotent on batch_id</text>
<line x1="900" y1="170" x2="950" y2="170" stroke="#64756C" stroke-width="2" marker-end="url(#ah)"/>
<rect x="950" y="120" width="210" height="100" rx="10" fill="#DFF0EC" stroke="#A9BFAE" stroke-width="1.5"/>
<text x="1055" y="152" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0A3527">Delta: account_risk</text>
<text x="1055" y="176" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#64756C">gold serving table</text>
<text x="1055" y="196" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#64756C">idempotent sink</text>
<line x1="1160" y1="170" x2="1200" y2="170" stroke="#64756C" stroke-width="2" marker-end="url(#ah)"/>
<rect x="1200" y="120" width="160" height="100" rx="10" fill="#FFFFFF" stroke="#A9BFAE" stroke-width="1.5" filter="url(#ks-card-shadow)" data-ks="card"/>
<text x="1280" y="152" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0A3527">Auth API</text>
<text x="1280" y="176" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#64756C">reads scores</text>
<text x="1280" y="196" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#64756C">~40 s swipe→decision</text>
<line x1="430" y1="240" x2="430" y2="300" stroke="#64756C" stroke-width="2" marker-end="url(#ah)"/>
<rect x="290" y="300" width="280" height="110" rx="10" fill="#E9F7F0" stroke="#A9BFAE" stroke-width="1.5"/>
<text x="430" y="334" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0A3527">Quarantine</text>
<text x="430" y="358" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#64756C">late events · future timestamps</text>
<text x="430" y="380" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#64756C">with arrival metadata</text>
<text x="760" y="330" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#64756C">← sanity filter: reject event_ts &gt; now + 1h</text>
<text x="760" y="352" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#64756C">← dropped-late rate is a first-class metric</text>
<rect x="40" y="460" width="1320" height="90" rx="10" fill="#E9F7F0" stroke="#A9BFAE" stroke-width="1.5"/>
<rect x="40" y="460" width="1320" height="90" rx="10" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="700" y="494" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#0A3527">Checkpoint storage — durable, separate from data. Offsets + state committed transactionally with each micro-batch.</text>
<text x="700" y="520" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#64756C">lose the checkpoint = the stream loses its memory · alert on checkpoint age</text>
<line x1="140" y1="460" x2="140" y2="428" stroke="#64756C" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#ah)"/>
<line x1="430" y1="460" x2="430" y2="412" stroke="#64756C" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#ah)"/>
<line x1="760" y1="460" x2="760" y2="428" stroke="#64756C" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#ah)"/>
<line x1="1055" y1="460" x2="1055" y2="428" stroke="#64756C" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#ah)"/>
<text x="700" y="596" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#0A3527">Monitor these three — throughput is vanity, these are health</text>
<rect x="140" y="612" width="340" height="110" rx="10" fill="#FFFFFF" stroke="#A9BFAE" stroke-width="1.5" filter="url(#ks-card-shadow)" data-ks="card"/>
<text x="310" y="650" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0A3527">Watermark age</text>
<text x="310" y="676" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#64756C">how far behind is event time?</text>
<rect x="540" y="612" width="340" height="110" rx="10" fill="#FFFFFF" stroke="#A9BFAE" stroke-width="1.5" filter="url(#ks-card-shadow)" data-ks="card"/>
<text x="710" y="650" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0A3527">Late-drop rate</text>
<text x="710" y="676" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#64756C">silent upstream changes look like volume drops</text>
<rect x="940" y="612" width="340" height="110" rx="10" fill="#FFFFFF" stroke="#A9BFAE" stroke-width="1.5" filter="url(#ks-card-shadow)" data-ks="card"/>
<text x="1110" y="650" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#0A3527">Checkpoint lag</text>
<text x="1110" y="676" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#64756C">earliest signal the stream is wedged</text>
</svg>