<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#43544B"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0FA968"/>
    </marker>
  <pattern id="ks-pinstripe" width="9" height="9" patternUnits="userSpaceOnUse">
    <path d="M0,9 L9,0" stroke="#0A3527" stroke-width="1.4" stroke-opacity="0.055"/>
  </pattern>
  <pattern id="ks-dotgrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.7" fill="#0A3527" fill-opacity="0.07"/>
  </pattern>
  <filter id="ks-card-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A3527" flood-opacity="0.14"/>
  </filter>
</defs>

  <rect x="0" y="0" width="1400" height="940" fill="#FFFFFF"/>

  <text x="700" y="52" text-anchor="middle" font-size="34" font-weight="bold" fill="#1a1a1a">CI/CD Stages for Data Pipelines</text>
  <rect x="640.0" y="68.0" width="120" height="6" rx="3" fill="#C49A1F" data-ks="title-rule"/><text x="700" y="82" text-anchor="middle" font-size="17" fill="#5A6A60">Every pull request is tested against a real deployment — merge promotes the same artifact</text>

  <!-- Source row -->
  <g font-size="15" fill="#2F3D36">
    <rect x="60" y="120" width="250" height="70" rx="10" fill="#DFF0EC" stroke="#5FB3AE"/>
    <text x="185" y="148" text-anchor="middle" font-weight="bold">GitHub repo</text>
    <text x="185" y="170" text-anchor="middle" font-size="12" fill="#64756C">notebooks · src/ · bundle.yml</text>

    <rect x="370" y="120" width="250" height="70" rx="10" fill="#E9F7F0" stroke="#0FA968" stroke-width="2"/>
    <text x="495" y="148" text-anchor="middle" font-weight="bold">Pull request</text>
    <text x="495" y="170" text-anchor="middle" font-size="12" fill="#64756C">trunk-based: short-lived branch</text>

    <rect x="680" y="120" width="250" height="70" rx="10" fill="#E9F7F0" stroke="#0FA968"/>
    <text x="805" y="148" text-anchor="middle" font-weight="bold">GitHub Actions</text>
    <text x="805" y="170" text-anchor="middle" font-size="12" fill="#64756C">runner + service principal</text>

    <rect x="990" y="120" width="350" height="70" rx="10" fill="#DFF0EC" stroke="#93A39A"/>
    <text x="1165" y="148" text-anchor="middle" font-weight="bold">Databricks targets</text>
    <text x="1165" y="170" text-anchor="middle" font-size="12" fill="#64756C">ci · staging · prod (Asset Bundles)</text>
  </g>

  <line x1="310" y1="155" x2="365" y2="155" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="155" x2="675" y2="155" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="930" y1="155" x2="985" y2="155" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 1 -->
  <rect x="40" y="230" width="1320" height="180" rx="14" fill="#F4FAF7" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="40" y="230" width="1320" height="180" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="70" y="262" font-size="18" font-weight="bold" fill="#1a1a1a">STAGE 1 — LINT &amp; VALIDATE</text>
  <text x="70" y="284" font-size="14" fill="#7E8B82">Runs on every push · seconds · blocks the PR on failure</text>
  <g font-size="14" fill="#2F3D36">
    <rect x="70" y="302" width="290" height="76" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="215" y="330" text-anchor="middle" font-weight="bold">Lint code</text>
    <text x="215" y="352" text-anchor="middle" font-size="12" fill="#64756C">ruff / pylint on src + notebooks</text>
    <rect x="390" y="302" width="290" height="76" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="535" y="330" text-anchor="middle" font-weight="bold">Validate bundle</text>
    <text x="535" y="352" text-anchor="middle" font-size="12" fill="#64756C">databricks bundle validate</text>
    <rect x="710" y="302" width="290" height="76" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="855" y="330" text-anchor="middle" font-weight="bold">Check SQL syntax</text>
    <text x="855" y="352" text-anchor="middle" font-size="12" fill="#64756C">parse queries &amp; expectations</text>
    <rect x="1030" y="302" width="300" height="76" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1180" y="330" text-anchor="middle" font-weight="bold">Secret hygiene</text>
    <text x="1180" y="352" text-anchor="middle" font-size="12" fill="#64756C">no hardcoded tokens in diff</text>
  </g>

  <!-- Stage 2 -->
  <rect x="40" y="440" width="1320" height="200" rx="14" fill="#FAF0D7" stroke="#C49A1F" stroke-width="2"/>
  <rect x="40" y="440" width="1320" height="200" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="70" y="472" font-size="18" font-weight="bold" fill="#8F6E14">STAGE 2 — INTEGRATION TEST ON EVERY PR</text>
  <text x="70" y="494" font-size="14" fill="#7E8B82">Deploys the real DLT pipeline to an isolated CI target · minutes</text>
  <g font-size="14" fill="#2F3D36">
    <rect x="70" y="512" width="240" height="96" rx="10" fill="#FFFFFF" stroke="#C49A1F" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="190" y="540" text-anchor="middle" font-weight="bold">Deploy to CI target</text>
    <text x="190" y="562" text-anchor="middle" font-size="12" fill="#64756C">bundle deploy -t ci</text>
    <text x="190" y="580" text-anchor="middle" font-size="12" fill="#64756C">scratch catalog per PR</text>
    <rect x="350" y="512" width="240" height="96" rx="10" fill="#FFFFFF" stroke="#C49A1F" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="470" y="540" text-anchor="middle" font-weight="bold">Run DLT pipeline</text>
    <text x="470" y="562" text-anchor="middle" font-size="12" fill="#64756C">50k-row fixture dataset</text>
    <text x="470" y="580" text-anchor="middle" font-size="12" fill="#64756C">expectations fire for real</text>
    <rect x="630" y="512" width="240" height="96" rx="10" fill="#FFFFFF" stroke="#C49A1F" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="750" y="540" text-anchor="middle" font-weight="bold">pytest integration</text>
    <text x="750" y="562" text-anchor="middle" font-size="12" fill="#64756C">row counts · null checks</text>
    <text x="750" y="580" text-anchor="middle" font-size="12" fill="#64756C">quarantine assertions</text>
    <rect x="910" y="512" width="240" height="96" rx="10" fill="#FFFFFF" stroke="#C49A1F" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1030" y="540" text-anchor="middle" font-weight="bold">Green check / block</text>
    <text x="1030" y="562" text-anchor="middle" font-size="12" fill="#64756C">merge blocked on failure</text>
    <text x="1030" y="580" text-anchor="middle" font-size="12" fill="#64756C">drop CI catalog after</text>
  </g>
  <line x1="310" y1="560" x2="345" y2="560" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="560" x2="625" y2="560" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="870" y1="560" x2="905" y2="560" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="40" y="670" width="1320" height="200" rx="14" fill="#E6F5F3" stroke="#0E8F8C" stroke-width="2"/>
  <rect x="40" y="670" width="1320" height="200" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="70" y="702" font-size="18" font-weight="bold" fill="#0E8F8C">STAGE 3 — DEPLOY ON MERGE</text>
  <text x="70" y="724" font-size="14" fill="#7E8B82">Same artifact, promoted through environments · no file copies</text>
  <g font-size="14" fill="#2F3D36">
    <rect x="70" y="742" width="290" height="96" rx="10" fill="#FFFFFF" stroke="#0E8F8C" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="215" y="770" text-anchor="middle" font-weight="bold">Merge to main</text>
    <text x="215" y="792" text-anchor="middle" font-size="12" fill="#64756C">trunk: merge daily, not weekly</text>
    <text x="215" y="810" text-anchor="middle" font-size="12" fill="#64756C">previous-good commit = rollback</text>
    <rect x="400" y="742" width="290" height="96" rx="10" fill="#FFFFFF" stroke="#0E8F8C" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="545" y="770" text-anchor="middle" font-weight="bold">Deploy → staging</text>
    <text x="545" y="792" text-anchor="middle" font-size="12" fill="#64756C">bundle deploy -t staging</text>
    <text x="545" y="810" text-anchor="middle" font-size="12" fill="#64756C">full pipeline run + smoke checks</text>
    <rect x="730" y="742" width="290" height="96" rx="10" fill="#FFFFFF" stroke="#0E8F8C" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="875" y="770" text-anchor="middle" font-weight="bold">Deploy → prod</text>
    <text x="875" y="792" text-anchor="middle" font-size="12" fill="#64756C">bundle deploy -t prod</text>
    <text x="875" y="810" text-anchor="middle" font-size="12" fill="#64756C">boring on purpose: same command</text>
    <rect x="1060" y="742" width="270" height="96" rx="10" fill="#FFFFFF" stroke="#0FA968" stroke-dasharray="8,5" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1195" y="770" text-anchor="middle" font-weight="bold" fill="#0FA968">Skip GitFlow</text>
    <text x="1195" y="792" text-anchor="middle" font-size="12" fill="#64756C">long-lived branches rot</text>
    <text x="1195" y="810" text-anchor="middle" font-size="12" fill="#64756C">against ever-changing data</text>
  </g>
  <line x1="360" y1="790" x2="395" y2="790" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="790" x2="725" y2="790" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- vertical flow connectors between stages -->
  <line x1="700" y1="410" x2="700" y2="438" stroke="#93A39A" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="640" x2="700" y2="668" stroke="#93A39A" stroke-width="2" marker-end="url(#arrow)"/>
</svg>