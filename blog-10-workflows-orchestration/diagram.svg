<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<rect width="1400" height="780" fill="#F4FAF7"/>
<rect width="1400" height="780" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="40" y="52" font-size="26" font-weight="700" fill="#0A3527">Workflows: nightly ML feature refresh with an SLA</text>
<rect x="40.0" y="66.0" width="120" height="6" rx="3" fill="#C49A1F" data-ks="title-rule"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2F3D36"/></marker><pattern id="ks-pinstripe" width="9" height="9" patternUnits="userSpaceOnUse">
    <path d="M0,9 L9,0" stroke="#0A3527" stroke-width="1.4" stroke-opacity="0.055"/>
  </pattern>
  <pattern id="ks-dotgrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.7" fill="#0A3527" fill-opacity="0.07"/>
  </pattern>
  <filter id="ks-card-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A3527" flood-opacity="0.14"/>
  </filter>
</defs><rect x="30" y="170" width="190" height="120" rx="10" fill="#FFFFFF" stroke="#C4D4CB" stroke-width="1.5" filter="url(#ks-card-shadow)" data-ks="card"/><text x="125.0" y="200" font-size="16" font-weight="600" fill="#0A3527" text-anchor="middle">ingest</text><text x="125.0" y="226" font-size="13.5" fill="#64756C" text-anchor="middle">Raw data in</text><text x="125.0" y="245" font-size="13.5" fill="#64756C" text-anchor="middle">3x retry</text><rect x="250" y="170" width="190" height="120" rx="10" fill="#FFFFFF" stroke="#C4D4CB" stroke-width="1.5" filter="url(#ks-card-shadow)" data-ks="card"/><text x="345.0" y="200" font-size="16" font-weight="600" fill="#0A3527" text-anchor="middle">validate</text><text x="345.0" y="226" font-size="13.5" fill="#64756C" text-anchor="middle">Quality gate</text><text x="345.0" y="245" font-size="13.5" fill="#64756C" text-anchor="middle">Stops bad data</text><rect x="470" y="170" width="190" height="120" rx="10" fill="#FFFFFF" stroke="#C4D4CB" stroke-width="1.5" filter="url(#ks-card-shadow)" data-ks="card"/><text x="565.0" y="200" font-size="16" font-weight="600" fill="#0A3527" text-anchor="middle">build_</text><text x="565.0" y="222" font-size="16" font-weight="600" fill="#0A3527" text-anchor="middle">features</text><text x="565.0" y="248" font-size="13.5" fill="#64756C" text-anchor="middle">Aggregates +</text><text x="565.0" y="267" font-size="13.5" fill="#64756C" text-anchor="middle">signals</text><rect x="690" y="170" width="190" height="120" rx="10" fill="#FFFFFF" stroke="#C4D4CB" stroke-width="1.5" filter="url(#ks-card-shadow)" data-ks="card"/><text x="785.0" y="200" font-size="16" font-weight="600" fill="#0A3527" text-anchor="middle">train</text><text x="785.0" y="226" font-size="13.5" fill="#64756C" text-anchor="middle">Weekly</text><text x="785.0" y="245" font-size="13.5" fill="#64756C" text-anchor="middle">retrain</text><rect x="910" y="170" width="190" height="120" rx="10" fill="#FFFFFF" stroke="#C4D4CB" stroke-width="1.5" filter="url(#ks-card-shadow)" data-ks="card"/><text x="1005.0" y="200" font-size="16" font-weight="600" fill="#0A3527" text-anchor="middle">evaluate</text><text x="1005.0" y="226" font-size="13.5" fill="#64756C" text-anchor="middle">Metrics gate</text><text x="1005.0" y="245" font-size="13.5" fill="#64756C" text-anchor="middle">Must pass</text><rect x="1130" y="170" width="190" height="120" rx="10" fill="#FFFFFF" stroke="#C4D4CB" stroke-width="1.5" filter="url(#ks-card-shadow)" data-ks="card"/><text x="1225.0" y="200" font-size="16" font-weight="600" fill="#0A3527" text-anchor="middle">publish</text><text x="1225.0" y="226" font-size="13.5" fill="#64756C" text-anchor="middle">Deploy features</text><text x="1225.0" y="245" font-size="13.5" fill="#64756C" text-anchor="middle">SLA 6:00 AM</text><line x1="220" y1="230.0" x2="250" y2="230.0" stroke="#2F3D36" stroke-width="2.5" marker-end="url(#ah)"/><line x1="440" y1="230.0" x2="470" y2="230.0" stroke="#2F3D36" stroke-width="2.5" marker-end="url(#ah)"/><line x1="660" y1="230.0" x2="690" y2="230.0" stroke="#2F3D36" stroke-width="2.5" marker-end="url(#ah)"/><line x1="880" y1="230.0" x2="910" y2="230.0" stroke="#2F3D36" stroke-width="2.5" marker-end="url(#ah)"/><line x1="1100" y1="230.0" x2="1130" y2="230.0" stroke="#2F3D36" stroke-width="2.5" marker-end="url(#ah)"/><rect x="52" y="130" width="146" height="30" rx="15.0" fill="#0FA968"/><text x="125.0" y="149.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">retries: 3</text><rect x="272" y="130" width="146" height="30" rx="15.0" fill="#0FA968"/><text x="345.0" y="149.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">on failure: stop</text><rect x="1152" y="130" width="146" height="30" rx="15.0" fill="#0B6E6B"/><text x="1225.0" y="149.5" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">SLA 6:00 AM</text><rect x="30" y="360" width="640" height="110" rx="10" fill="#FFFFFF" stroke="#C4D4CB" stroke-width="1.5" filter="url(#ks-card-shadow)" data-ks="card"/><text x="350.0" y="390" font-size="16" font-weight="600" fill="#0A3527" text-anchor="middle">Run fails at task 4?</text><text x="350.0" y="416" font-size="13.5" fill="#64756C" text-anchor="middle">Fix the issue, repair the run, resume from the failed task</text><text x="350.0" y="435" font-size="13.5" fill="#64756C" text-anchor="middle">No hand-written “resume from step N” scripts</text><rect x="710" y="360" width="660" height="110" rx="10" fill="#FFFFFF" stroke="#C4D4CB" stroke-width="1.5" filter="url(#ks-card-shadow)" data-ks="card"/><text x="1040.0" y="390" font-size="16" font-weight="600" fill="#0A3527" text-anchor="middle">Alerts that reach you</text><text x="1040.0" y="416" font-size="13.5" fill="#64756C" text-anchor="middle">Slack / email / PagerDuty on failure or SLA miss</text><text x="1040.0" y="435" font-size="13.5" fill="#64756C" text-anchor="middle">Page at 5:30 AM if not green — 30 min before the SLA</text><rect x="30" y="510" width="1340" height="210" rx="12" fill="#FFFFFF" stroke="#C4D4CB" stroke-width="1.5"/><text x="60" y="550" font-size="18" font-weight="700" fill="#0A3527">Compute choice (the cost decision)</text><rect x="60" y="570" width="620" height="120" rx="10" fill="#F4FAF7" stroke="#C9EBD8" stroke-width="2"/><rect x="60" y="570" width="620" height="120" rx="10" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="370" y="602" font-size="16" font-weight="700" fill="#0FA968" text-anchor="middle">Job clusters — production default</text><text x="370" y="630" font-size="14" fill="#0A3527" text-anchor="middle">Spun up per run, terminated after</text><text x="370" y="654" font-size="14" fill="#0A3527" text-anchor="middle">Pay for 40 min, not 24 hours</text><rect x="720" y="570" width="620" height="120" rx="10" fill="#F4FAF7" stroke="#7ED6A8" stroke-width="2"/><rect x="720" y="570" width="620" height="120" rx="10" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="1030" y="602" font-size="16" font-weight="700" fill="#0FA968" text-anchor="middle">All-purpose clusters — dev only</text><text x="1030" y="630" font-size="14" fill="#0A3527" text-anchor="middle">Long-running, shared, interactive</text><text x="1030" y="654" font-size="14" fill="#0A3527" text-anchor="middle">24/7 for a 40-min job = money fire</text></svg>