<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#43544B"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0FA968"/>
    </marker>
  <pattern id="ks-pinstripe" width="9" height="9" patternUnits="userSpaceOnUse">
    <path d="M0,9 L9,0" stroke="#0A3527" stroke-width="1.4" stroke-opacity="0.055"/>
  </pattern>
  <pattern id="ks-dotgrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.7" fill="#0A3527" fill-opacity="0.07"/>
  </pattern>
  <filter id="ks-card-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A3527" flood-opacity="0.14"/>
  </filter>
</defs>

  <rect x="0" y="0" width="1400" height="920" fill="#FFFFFF"/>

  <text x="700" y="52" text-anchor="middle" font-size="34" font-weight="bold" fill="#1a1a1a">The Lakehouse Architecture</text>
  <rect x="640.0" y="68.0" width="120" height="6" rx="3" fill="#C49A1F" data-ks="title-rule"/><text x="700" y="82" text-anchor="middle" font-size="17" fill="#5A6A60">One copy of the data on open storage — many engines reading it</text>

  <!-- Control plane -->
  <rect x="40" y="110" width="1320" height="150" rx="14" fill="#E9F7F0" stroke="#0FA968" stroke-width="2"/>
  <rect x="40" y="110" width="1320" height="150" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><rect x="40" y="110" width="1320" height="150" rx="14" fill="none"/>
  <text x="70" y="142" font-size="18" font-weight="bold" fill="#0FA968">CONTROL PLANE</text>
  <text x="70" y="164" font-size="14" fill="#7E8B82">Managed by Databricks — your data never lives here</text>

  <g font-size="15" fill="#2F3D36">
    <rect x="70" y="182" width="220" height="56" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="180" y="205" text-anchor="middle" font-weight="bold">Workspace UI</text>
    <text x="180" y="226" text-anchor="middle" font-size="12" fill="#64756C">Notebooks · SQL · Repos</text>

    <rect x="310" y="182" width="220" height="56" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="420" y="205" text-anchor="middle" font-weight="bold">Unity Catalog</text>
    <text x="420" y="226" text-anchor="middle" font-size="12" fill="#64756C">Governance · Lineage · ACLs</text>

    <rect x="550" y="182" width="220" height="56" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="660" y="205" text-anchor="middle" font-weight="bold">Workflows</text>
    <text x="660" y="226" text-anchor="middle" font-size="12" fill="#64756C">Orchestration · Alerts</text>

    <rect x="790" y="182" width="220" height="56" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="900" y="205" text-anchor="middle" font-weight="bold">Model Serving</text>
    <text x="900" y="226" text-anchor="middle" font-size="12" fill="#64756C">Endpoints · GenAI</text>

    <rect x="1030" y="182" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1180" y="205" text-anchor="middle" font-weight="bold">Cluster Manager</text>
    <text x="1180" y="226" text-anchor="middle" font-size="12" fill="#64756C">Ephemeral compute in your VPC</text>
  </g>

  <!-- Data plane -->
  <rect x="40" y="290" width="1320" height="580" rx="14" fill="#F4FAF7" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="10,6"/>
  <rect x="40" y="290" width="1320" height="580" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="70" y="322" font-size="18" font-weight="bold" fill="#1a1a1a">DATA PLANE</text>
  <text x="70" y="344" font-size="14" fill="#7E8B82">Runs in YOUR cloud account (AWS / Azure / GCP) — your data stays here</text>

  <!-- Sources -->
  <text x="150" y="392" text-anchor="middle" font-size="16" font-weight="bold" fill="#43544B">SOURCES</text>
  <g font-size="14" fill="#2F3D36">
    <rect x="60" y="408" width="180" height="52" rx="10" fill="#DFF0EC" stroke="#5FB3AE"/>
    <text x="150" y="438" text-anchor="middle">Event streams</text>
    <rect x="60" y="472" width="180" height="52" rx="10" fill="#DFF0EC" stroke="#5FB3AE"/>
    <text x="150" y="502" text-anchor="middle">Databases (CDC)</text>
    <rect x="60" y="536" width="180" height="52" rx="10" fill="#DFF0EC" stroke="#5FB3AE"/>
    <text x="150" y="566" text-anchor="middle">Files / APIs</text>
  </g>

  <!-- Ingest arrow -->
  <line x1="250" y1="500" x2="330" y2="500" stroke="#43544B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="290" y="488" text-anchor="middle" font-size="13" fill="#43544B">ingest</text>

  <!-- Medallion -->
  <rect x="340" y="380" width="640" height="330" rx="14" fill="#FFFFFF" stroke="#0FA968" stroke-width="2" filter="url(#ks-card-shadow)" data-ks="card"/>
  <text x="660" y="410" text-anchor="middle" font-size="16" font-weight="bold" fill="#0FA968">DELTA LAKE on object storage</text>
  <text x="660" y="432" text-anchor="middle" font-size="13" fill="#7E8B82">S3 · ADLS · GCS — Parquet + transaction log (ACID, time travel)</text>

  <g font-size="15" fill="#1a1a1a">
    <rect x="365" y="455" width="185" height="150" rx="12" fill="#FAF0D7" stroke="#C49A1F" stroke-width="2"/>
    <text x="457" y="490" text-anchor="middle" font-weight="bold" font-size="19" fill="#8F6E14">BRONZE</text>
    <text x="457" y="516" text-anchor="middle" font-size="13" fill="#43544B">Raw ingestion</text>
    <text x="457" y="538" text-anchor="middle" font-size="13" fill="#43544B">Append-only</text>
    <text x="457" y="560" text-anchor="middle" font-size="13" fill="#43544B">Exactly as arrived</text>
    <text x="457" y="590" text-anchor="middle" font-size="12" font-style="italic" fill="#8F6E14">insurance policy</text>

    <rect x="567" y="455" width="185" height="150" rx="12" fill="#DFF0EC" stroke="#0B6E6B" stroke-width="2"/>
    <text x="659" y="490" text-anchor="middle" font-weight="bold" font-size="19" fill="#0A3527">SILVER</text>
    <text x="659" y="516" text-anchor="middle" font-size="13" fill="#43544B">Cleaned · validated</text>
    <text x="659" y="538" text-anchor="middle" font-size="13" fill="#43544B">Deduplicated</text>
    <text x="659" y="560" text-anchor="middle" font-size="13" fill="#43544B">Schema enforced</text>
    <text x="659" y="590" text-anchor="middle" font-size="12" font-style="italic" fill="#0A3527">trusted layer</text>

    <rect x="769" y="455" width="185" height="150" rx="12" fill="#FAF0D7" stroke="#C49A1F" stroke-width="2"/>
    <text x="861" y="490" text-anchor="middle" font-weight="bold" font-size="19" fill="#8F6E14">GOLD</text>
    <text x="861" y="516" text-anchor="middle" font-size="13" fill="#43544B">Business aggregates</text>
    <text x="861" y="538" text-anchor="middle" font-size="13" fill="#43544B">Feature tables</text>
    <text x="861" y="560" text-anchor="middle" font-size="13" fill="#43544B">Query-optimized</text>
    <text x="861" y="590" text-anchor="middle" font-size="12" font-style="italic" fill="#8F6E14">serving layer</text>
  </g>

  <line x1="550" y1="530" x2="567" y2="530" stroke="#43544B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="752" y1="530" x2="769" y2="530" stroke="#43544B" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="660" y="650" text-anchor="middle" font-size="13" fill="#43544B">Compute: ephemeral clusters (your VPC) — spin up, process, terminate</text>
  <text x="660" y="676" text-anchor="middle" font-size="13" fill="#43544B">Storage and compute fully separated — you pay for compute by the minute</text>

  <!-- Consumers -->
  <line x1="980" y1="500" x2="1060" y2="440" stroke="#43544B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="980" y1="530" x2="1060" y2="590" stroke="#43544B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1210" y="392" text-anchor="middle" font-size="16" font-weight="bold" fill="#43544B">CONSUMERS</text>
  <g font-size="14" fill="#2F3D36">
    <rect x="1070" y="408" width="280" height="60" rx="10" fill="#E9F7F0" stroke="#2FBF7F" stroke-width="1.5"/>
    <text x="1210" y="432" text-anchor="middle" font-weight="bold">BI &amp; Dashboards</text>
    <text x="1210" y="454" text-anchor="middle" font-size="12" fill="#64756C">Databricks SQL · Photon</text>
    <rect x="1070" y="482" width="280" height="60" rx="10" fill="#E9F7F0" stroke="#2FBF7F" stroke-width="1.5"/>
    <text x="1210" y="506" text-anchor="middle" font-weight="bold">Machine Learning</text>
    <text x="1210" y="528" text-anchor="middle" font-size="12" fill="#64756C">Feature Store · MLflow</text>
    <rect x="1070" y="556" width="280" height="60" rx="10" fill="#E9F7F0" stroke="#2FBF7F" stroke-width="1.5"/>
    <text x="1210" y="580" text-anchor="middle" font-weight="bold">GenAI Apps</text>
    <text x="1210" y="602" text-anchor="middle" font-size="12" fill="#64756C">RAG · Model Serving</text>
  </g>

  <!-- Governance note -->
  <rect x="340" y="720" width="1010" height="110" rx="12" fill="#DFF0EC" stroke="#2E9E8F" stroke-width="1.5"/>
  <rect x="340" y="720" width="1010" height="110" rx="12" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="660" y="752" text-anchor="middle" font-size="15" font-weight="bold" fill="#0B6E6B">Unity Catalog governs everything</text>
  <text x="660" y="778" text-anchor="middle" font-size="13" fill="#43544B">One permission model across all layers · column-level access control · full data lineage · audit logs</text>
  <text x="660" y="804" text-anchor="middle" font-size="13" fill="#43544B">Your Delta tables stay in your buckets — open Parquet, no lock-in</text>
</svg>