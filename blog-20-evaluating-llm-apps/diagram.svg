<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#43544B"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0FA968"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0FA968"/>
    </marker>
  <pattern id="ks-pinstripe" width="9" height="9" patternUnits="userSpaceOnUse">
    <path d="M0,9 L9,0" stroke="#0A3527" stroke-width="1.4" stroke-opacity="0.055"/>
  </pattern>
  <pattern id="ks-dotgrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.7" fill="#0A3527" fill-opacity="0.07"/>
  </pattern>
  <filter id="ks-card-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A3527" flood-opacity="0.14"/>
  </filter>
</defs>

  <rect x="0" y="0" width="1400" height="980" fill="#FFFFFF"/>

  <text x="700" y="52" text-anchor="middle" font-size="34" font-weight="bold" fill="#1a1a1a">The Eval Harness in CI/CD</text>
  <rect x="640.0" y="68.0" width="120" height="6" rx="3" fill="#C49A1F" data-ks="title-rule"/><text x="700" y="82" text-anchor="middle" font-size="17" fill="#5A6A60">Golden dataset → judges → quality gate: no red PR merges</text>

  <!-- Golden dataset -->
  <rect x="40" y="110" width="380" height="360" rx="14" fill="#F0FAF8" stroke="#0E8F8C" stroke-width="2"/>
  <rect x="40" y="110" width="380" height="360" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="70" y="142" font-size="18" font-weight="bold" fill="#0E8F8C">GOLDEN DATASET</text>
  <text x="70" y="164" font-size="14" fill="#7E8B82">Delta table · helpdesk_golden_v7</text>
  <g font-size="14" fill="#2F3D36">
    <rect x="70" y="182" width="320" height="62" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="230" y="208" text-anchor="middle" font-weight="bold">150 real user questions</text>
    <text x="230" y="230" text-anchor="middle" font-size="13" fill="#64756C">sampled from production logs</text>
    <rect x="70" y="256" width="320" height="62" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="230" y="282" text-anchor="middle" font-weight="bold">Expected doc IDs per case</text>
    <text x="230" y="304" text-anchor="middle" font-size="13" fill="#64756C">40 with human reference answers</text>
    <rect x="70" y="330" width="320" height="62" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="230" y="356" text-anchor="middle" font-weight="bold">Failure-mode coverage</text>
    <text x="230" y="378" text-anchor="middle" font-size="13" fill="#64756C">adversarial · ambiguous · unanswerable</text>
    <rect x="70" y="404" width="320" height="50" rx="10" fill="#FAF0D7" stroke="#8F6E14"/>
    <text x="230" y="434" text-anchor="middle" font-size="13" fill="#8F6E14">Versioned — v7 → v8 is a diff</text>
  </g>
  <line x1="420" y1="290" x2="466" y2="290" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Harness -->
  <rect x="470" y="110" width="480" height="360" rx="14" fill="#E9F7F0" stroke="#0FA968" stroke-width="2"/>
  <rect x="470" y="110" width="480" height="360" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="500" y="142" font-size="18" font-weight="bold" fill="#0FA968">EVAL HARNESS</text>
  <text x="500" y="164" font-size="14" fill="#7E8B82">mlflow.evaluate() on the candidate</text>
  <g font-size="14" fill="#2F3D36">
    <rect x="500" y="182" width="420" height="66" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="710" y="208" text-anchor="middle" font-weight="bold">Candidate app version</text>
    <text x="710" y="230" text-anchor="middle" font-size="13" fill="#64756C">answers all 150 questions</text>
    <rect x="500" y="262" width="420" height="76" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="710" y="288" text-anchor="middle" font-weight="bold">Deterministic checks (free)</text>
    <text x="710" y="310" text-anchor="middle" font-size="13" fill="#64756C">valid JSON · citations ⊆ retrieved · length</text>
    <rect x="500" y="352" width="420" height="76" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="710" y="378" text-anchor="middle" font-weight="bold">LLM judges (2–3x, averaged)</text>
    <text x="710" y="400" text-anchor="middle" font-size="13" fill="#64756C">groundedness 1–5 · completeness 1–5</text>
  </g>
  <line x1="710" y1="248" x2="710" y2="258" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="338" x2="710" y2="348" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="950" y1="290" x2="996" y2="290" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Gate -->
  <rect x="1000" y="110" width="360" height="360" rx="14" fill="#F4FAF7" stroke="#0FA968" stroke-width="2"/>
  <rect x="1000" y="110" width="360" height="360" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="1030" y="142" font-size="18" font-weight="bold" fill="#0FA968">QUALITY GATE</text>
  <text x="1030" y="164" font-size="14" fill="#7E8B82">Compare vs main baseline</text>
  <g font-size="14" fill="#2F3D36">
    <rect x="1030" y="182" width="300" height="110" rx="10" fill="#FFFFFF" stroke="#0FA968" stroke-width="1.5" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1180" y="210" text-anchor="middle" font-weight="bold" fill="#0FA968">PASS → merge &amp; deploy</text>
    <text x="1180" y="232" text-anchor="middle" font-size="13" fill="#64756C">no regression vs baseline</text>
    <text x="1180" y="254" text-anchor="middle" font-size="13" fill="#64756C">thresholds met</text>
    <rect x="1030" y="306" width="300" height="110" rx="10" fill="#FFFFFF" stroke="#0FA968" stroke-width="1.5" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1180" y="334" text-anchor="middle" font-weight="bold" fill="#0FA968">FAIL → PR blocked</text>
    <text x="1180" y="356" text-anchor="middle" font-size="13" fill="#64756C">regression vs baseline</text>
    <text x="1180" y="378" text-anchor="middle" font-size="13" fill="#64756C">fix, don't ship red</text>
  </g>

  <!-- CI/CD band -->
  <rect x="40" y="520" width="1320" height="180" rx="14" fill="#F4FAF7" stroke="#B9C7BE" stroke-width="2"/>
  <rect x="40" y="520" width="1320" height="180" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="70" y="552" font-size="18" font-weight="bold" fill="#43544B">CI/CD LOOP</text>
  <text x="70" y="574" font-size="14" fill="#7E8B82">Every PR runs the harness — quality is a gate, not a report</text>
  <g font-size="14" fill="#2F3D36">
    <rect x="70" y="592" width="220" height="80" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="180" y="622" text-anchor="middle" font-weight="bold">PR opened</text>
    <text x="180" y="644" text-anchor="middle" font-size="12" fill="#64756C">prompt / model / retrieval</text>
    <rect x="330" y="592" width="220" height="80" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="440" y="622" text-anchor="middle" font-weight="bold">CI runs harness</text>
    <text x="440" y="644" text-anchor="middle" font-size="12" fill="#64756C">150 cases · ~20 min</text>
    <rect x="590" y="592" width="220" height="80" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="700" y="622" text-anchor="middle" font-weight="bold">MLflow logs scores</text>
    <text x="700" y="644" text-anchor="middle" font-size="12" fill="#64756C">per-case · per-metric</text>
    <rect x="850" y="592" width="220" height="80" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="960" y="622" text-anchor="middle" font-weight="bold">Gate decides</text>
    <text x="960" y="644" text-anchor="middle" font-size="12" fill="#64756C">vs baseline + thresholds</text>
    <rect x="1110" y="592" width="220" height="80" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1220" y="622" text-anchor="middle" font-weight="bold">Merge / block</text>
    <text x="1220" y="644" text-anchor="middle" font-size="12" fill="#64756C">green ships · red stops</text>
  </g>
  <line x1="290" y1="632" x2="326" y2="632" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="632" x2="586" y2="632" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="632" x2="846" y2="632" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1070" y1="632" x2="1106" y2="632" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Maintenance -->
  <rect x="40" y="740" width="1320" height="190" rx="14" fill="#FAF0D7" stroke="#8F6E14" stroke-width="2"/>
  <rect x="40" y="740" width="1320" height="190" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="70" y="772" font-size="18" font-weight="bold" fill="#8F6E14">KEEPING THE HARNESS HONEST</text>
  <g font-size="14" fill="#2F3D36">
    <rect x="70" y="790" width="400" height="110" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="270" y="818" text-anchor="middle" font-weight="bold">Calibrate judges monthly</text>
    <text x="270" y="842" text-anchor="middle" font-size="13" fill="#64756C">30 cases: human vs judge —</text>
    <text x="270" y="864" text-anchor="middle" font-size="13" fill="#64756C">rewrite the rubric on drift</text>
    <rect x="500" y="790" width="400" height="110" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="700" y="818" text-anchor="middle" font-weight="bold">Refresh the golden set</text>
    <text x="700" y="842" text-anchor="middle" font-size="13" fill="#64756C">quarterly: sample fresh traffic,</text>
    <text x="700" y="864" text-anchor="middle" font-size="13" fill="#64756C">retire stale cases</text>
    <rect x="930" y="790" width="400" height="110" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1130" y="818" text-anchor="middle" font-weight="bold">Watch for gaming</text>
    <text x="1130" y="842" text-anchor="middle" font-size="13" fill="#64756C">keep one metric nobody</text>
    <text x="1130" y="864" text-anchor="middle" font-size="13" fill="#64756C">optimizes for, as the canary</text>
  </g>
</svg>