<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#43544B"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0FA968"/>
    </marker>
  <pattern id="ks-pinstripe" width="9" height="9" patternUnits="userSpaceOnUse">
    <path d="M0,9 L9,0" stroke="#0A3527" stroke-width="1.4" stroke-opacity="0.055"/>
  </pattern>
  <pattern id="ks-dotgrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.7" fill="#0A3527" fill-opacity="0.07"/>
  </pattern>
  <filter id="ks-card-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A3527" flood-opacity="0.14"/>
  </filter>
</defs>

  <rect x="0" y="0" width="1400" height="940" fill="#FFFFFF"/>

  <text x="700" y="52" text-anchor="middle" font-size="34" font-weight="bold" fill="#1a1a1a">RAG Architecture on Databricks</text>
  <rect x="640.0" y="68.0" width="120" height="6" rx="3" fill="#C49A1F" data-ks="title-rule"/><text x="700" y="82" text-anchor="middle" font-size="17" fill="#5A6A60">Open-source embeddings + open-source LLMs — your data never leaves your VPC</text>

  <!-- Ingestion pipeline -->
  <rect x="40" y="120" width="620" height="560" rx="14" fill="#E6F5F3" stroke="#0E8F8C" stroke-width="2"/>
  <rect x="40" y="120" width="620" height="560" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="70" y="152" font-size="18" font-weight="bold" fill="#0E8F8C">OFFLINE — KNOWLEDGE PIPELINE</text>
  <text x="70" y="174" font-size="14" fill="#7E8B82">runs on schedule · re-embeds only changed chunks</text>
  <g font-size="14" fill="#2F3D36">
    <rect x="70" y="196" width="270" height="90" rx="10" fill="#DFF0EC" stroke="#5FB3AE"/>
    <text x="205" y="222" text-anchor="middle" font-weight="bold">Docs land in lake</text>
    <text x="205" y="244" text-anchor="middle" font-size="12" fill="#64756C">PDFs · HTML · tickets</text>
    <text x="205" y="262" text-anchor="middle" font-size="12" fill="#64756C">Autoloader → bronze Delta</text>
    <rect x="370" y="196" width="260" height="90" rx="10" fill="#FFFFFF" stroke="#0E8F8C" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="500" y="222" text-anchor="middle" font-weight="bold">Parse + chunk</text>
    <text x="500" y="244" text-anchor="middle" font-size="12" fill="#64756C">~512 tokens, 50 overlap</text>
    <text x="500" y="262" text-anchor="middle" font-size="12" fill="#64756C">split on semantic boundaries</text>
    <rect x="70" y="310" width="270" height="90" rx="10" fill="#FFFFFF" stroke="#0E8F8C" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="205" y="336" text-anchor="middle" font-weight="bold">Embed (BGE / E5)</text>
    <text x="205" y="358" text-anchor="middle" font-size="12" fill="#64756C">GPU batch job · open-source</text>
    <text x="205" y="376" text-anchor="middle" font-size="12" fill="#64756C">merge on chunk hash</text>
    <rect x="370" y="310" width="260" height="90" rx="10" fill="#FFFFFF" stroke="#0E8F8C" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="500" y="336" text-anchor="middle" font-weight="bold">Embedding Delta table</text>
    <text x="500" y="358" text-anchor="middle" font-size="12" fill="#64756C">chunk_id · text · vector</text>
    <text x="500" y="376" text-anchor="middle" font-size="12" fill="#64756C">metadata: source · page · version</text>
    <rect x="170" y="424" width="360" height="90" rx="10" fill="#FFFFFF" stroke="#0E8F8C" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="350" y="450" text-anchor="middle" font-weight="bold">Vector Search index</text>
    <text x="350" y="472" text-anchor="middle" font-size="12" fill="#64756C">managed index on the Delta table</text>
    <text x="350" y="490" text-anchor="middle" font-size="12" fill="#64756C">hybrid search: vector + keyword</text>
    <rect x="170" y="538" width="360" height="90" rx="10" fill="#E9F7F0" stroke="#0FA968" stroke-dasharray="8,5"/>
    <rect x="170" y="538" width="360" height="90" rx="10" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="350" y="564" text-anchor="middle" font-weight="bold" fill="#0FA968">Unity Catalog governance</text>
    <text x="350" y="586" text-anchor="middle" font-size="12" fill="#64756C">row-level security on docs</text>
    <text x="350" y="604" text-anchor="middle" font-size="12" fill="#64756C">bot never answers from forbidden pages</text>
  </g>
  <line x1="340" y1="241" x2="365" y2="241" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="205" y1="286" x2="205" y2="305" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="355" x2="365" y2="355" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="400" x2="350" y2="419" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Serving loop -->
  <rect x="700" y="120" width="660" height="560" rx="14" fill="#E9F7F0" stroke="#0B6B4F" stroke-width="2"/>
  <rect x="700" y="120" width="660" height="560" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="730" y="152" font-size="18" font-weight="bold" fill="#0B6B4F">ONLINE — QUERY LOOP</text>
  <text x="730" y="174" font-size="14" fill="#7E8B82">everything inside your cloud account</text>
  <g font-size="14" fill="#2F3D36">
    <rect x="730" y="196" width="280" height="90" rx="10" fill="#FFFFFF" stroke="#0B6B4F" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="870" y="222" text-anchor="middle" font-weight="bold">User question</text>
    <text x="870" y="244" text-anchor="middle" font-size="12" fill="#64756C">"how do I reset my API key?"</text>
    <text x="870" y="262" text-anchor="middle" font-size="12" fill="#64756C">chat UI / support widget</text>
    <rect x="1050" y="196" width="280" height="90" rx="10" fill="#FFFFFF" stroke="#0B6B4F" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1190" y="222" text-anchor="middle" font-weight="bold">Embed question</text>
    <text x="1190" y="244" text-anchor="middle" font-size="12" fill="#64756C">same BGE model as docs</text>
    <text x="1190" y="262" text-anchor="middle" font-size="12" fill="#64756C">query vector</text>
    <rect x="730" y="310" width="280" height="90" rx="10" fill="#FFFFFF" stroke="#0B6B4F" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="870" y="336" text-anchor="middle" font-weight="bold">Retrieve top-k chunks</text>
    <text x="870" y="358" text-anchor="middle" font-size="12" fill="#64756C">Vector Search · hybrid ranking</text>
    <text x="870" y="376" text-anchor="middle" font-size="12" fill="#64756C">low score → escalate to human</text>
    <rect x="1050" y="310" width="280" height="90" rx="10" fill="#FFFFFF" stroke="#0B6B4F" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1190" y="336" text-anchor="middle" font-weight="bold">Generate answer</text>
    <text x="1190" y="358" text-anchor="middle" font-size="12" fill="#64756C">Llama / Mistral via Model Serving</text>
    <text x="1190" y="376" text-anchor="middle" font-size="12" fill="#64756C">chunks + question in prompt</text>
    <rect x="860" y="424" width="340" height="90" rx="10" fill="#FFFFFF" stroke="#0FA968" stroke-width="2" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1030" y="450" text-anchor="middle" font-weight="bold">Answer + citations</text>
    <text x="1030" y="472" text-anchor="middle" font-size="12" fill="#64756C">links to source pages</text>
    <text x="1030" y="490" text-anchor="middle" font-size="12" fill="#64756C">agents can verify · users trust</text>
    <rect x="860" y="538" width="340" height="90" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1030" y="564" text-anchor="middle" font-weight="bold">Feedback → golden dataset</text>
    <text x="1030" y="586" text-anchor="middle" font-size="12" fill="#64756C">agent ratings · weekly review</text>
    <text x="1030" y="604" text-anchor="middle" font-size="12" fill="#64756C">regression-test every prompt change</text>
  </g>
  <line x1="1010" y1="241" x2="1045" y2="241" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1190" y1="286" x2="870" y2="305" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1010" y1="355" x2="1045" y2="355" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1030" y1="400" x2="1030" y2="419" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1030" y1="514" x2="1030" y2="533" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- cross link: index feeds retrieval -->
  <line x1="660" y1="469" x2="725" y2="355" stroke="#93A39A" stroke-width="2" stroke-dasharray="8,5" marker-end="url(#arrow)"/>
  <text x="692" y="400" text-anchor="middle" font-size="12" fill="#64756C" transform="rotate(-38 692 400)">index</text>

  <!-- Northwind strip -->
  <rect x="40" y="720" width="1320" height="160" rx="14" fill="#F4FAF7" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="40" y="720" width="1320" height="160" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="70" y="754" font-size="18" font-weight="bold" fill="#1a1a1a">NORTHWIND SUPPORT BOT — WHAT MADE IT WORK</text>
  <g font-size="14" fill="#2F3D36">
    <text x="70" y="788">10,000 pages → ~180,000 chunks · only changed chunks re-embedded on doc updates · confidence-gated escalation (bot admits ignorance instead of hallucinating)</text>
    <text x="70" y="820">150-question golden dataset scores every prompt/chunking change before deploy · per-query cost far below commercial APIs · zero data leaves the account</text>
    <text x="70" y="852" font-size="13" fill="#43544B">The number the support lead cared about: consistency — the same question gets the same correct, cited answer every time.</text>
  </g>
</svg>