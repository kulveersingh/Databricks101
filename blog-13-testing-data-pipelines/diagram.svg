<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#43544B"/>
    </marker>
  <pattern id="ks-pinstripe" width="9" height="9" patternUnits="userSpaceOnUse">
    <path d="M0,9 L9,0" stroke="#0A3527" stroke-width="1.4" stroke-opacity="0.055"/>
  </pattern>
  <pattern id="ks-dotgrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.7" fill="#0A3527" fill-opacity="0.07"/>
  </pattern>
  <filter id="ks-card-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A3527" flood-opacity="0.14"/>
  </filter>
</defs>

  <rect x="0" y="0" width="1400" height="940" fill="#FFFFFF"/>

  <text x="700" y="52" text-anchor="middle" font-size="34" font-weight="bold" fill="#1a1a1a">Test Pyramid for Data Pipelines</text>
  <rect x="640.0" y="68.0" width="120" height="6" rx="3" fill="#C49A1F" data-ks="title-rule"/><text x="700" y="82" text-anchor="middle" font-size="17" fill="#5A6A60">"It ran without errors" is not a test — test the code, the pipeline, and the data</text>

  <!-- Pyramid -->
  <polygon points="520,860 880,860 700,180" fill="#DFF0EC" stroke="#0E8F8C" stroke-width="2"/>
  <line x1="595" y1="640" x2="805" y2="640" stroke="#0E8F8C" stroke-width="2"/>
  <line x1="645" y1="430" x2="755" y2="430" stroke="#0E8F8C" stroke-width="2"/>

  <text x="700" y="360" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Data quality tests</text>
  <text x="700" y="388" text-anchor="middle" font-size="14" fill="#43544B">run in PRODUCTION, every batch</text>

  <text x="700" y="560" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Integration tests</text>
  <text x="700" y="588" text-anchor="middle" font-size="14" fill="#43544B">run in CI against fixture data</text>

  <text x="700" y="770" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Unit tests</text>
  <text x="700" y="798" text-anchor="middle" font-size="14" fill="#43544B">every commit · fastest · most numerous</text>

  <!-- Left annotations -->
  <g font-size="14" fill="#2F3D36">
    <rect x="40" y="180" width="400" height="150" rx="10" fill="#E9F7F0" stroke="#0FA968"/>
    <rect x="40" y="180" width="400" height="150" rx="10" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="60" y="212" font-weight="bold" font-size="16" fill="#0FA968">TOP — few, continuous</text>
    <text x="60" y="238">DLT expectations: expect_or_drop,</text>
    <text x="60" y="260">expect_or_fail on every run</text>
    <text x="60" y="286">Catches: schema changes, null spikes,</text>
    <text x="60" y="308">upstream breakage at 2am</text>

    <rect x="40" y="440" width="400" height="170" rx="10" fill="#FAF0D7" stroke="#C49A1F"/>
    <rect x="40" y="440" width="400" height="170" rx="10" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="60" y="472" font-weight="bold" font-size="16" fill="#8F6E14">MIDDLE — slower, end-to-end</text>
    <text x="60" y="498">Deploy DLT pipeline to CI target,</text>
    <text x="60" y="520">run on versioned fixture dataset</text>
    <text x="60" y="546">Catches: wrong table names, missing</text>
    <text x="60" y="568">grants, broken stage dependencies</text>
    <text x="60" y="594" font-size="12" fill="#64756C">minutes per run — every PR</text>

    <rect x="40" y="700" width="400" height="170" rx="10" fill="#E9F7F0" stroke="#0B6B4F"/>
    <rect x="40" y="700" width="400" height="170" rx="10" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="60" y="732" font-weight="bold" font-size="16" fill="#0B6B4F">BASE — many, milliseconds</text>
    <text x="60" y="758">pytest on pure transform functions</text>
    <text x="60" y="780">(DataFrame in → DataFrame out)</text>
    <text x="60" y="806">Catches: dedup logic, currency bugs,</text>
    <text x="60" y="828">business-rule regressions</text>
    <text x="60" y="854" font-size="12" fill="#64756C">local Spark session — no cluster needed</text>
  </g>

  <!-- Right annotations: fixtures -->
  <rect x="960" y="180" width="400" height="430" rx="14" fill="#F4FAF7" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="960" y="180" width="400" height="430" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="980" y="214" font-size="16" font-weight="bold" fill="#1a1a1a">FIXTURE DATASETS</text>
  <text x="980" y="236" font-size="13" fill="#7E8B82">the foundation every layer stands on</text>
  <g font-size="14" fill="#2F3D36">
    <text x="980" y="270">• Versioned with the code, in the repo</text>
    <text x="980" y="296">• Small (thousands of rows) but nasty:</text>
    <text x="1000" y="322">nulls, dupes, out-of-range values,</text>
    <text x="1000" y="348">unicode, DST-boundary timestamps</text>
    <text x="980" y="378">• Deterministic: fixed-seed generation,</text>
    <text x="980" y="404">  hand-written edge cases</text>
    <text x="980" y="434">• Refreshed from production SHAPES,</text>
    <text x="980" y="460">  never production DATA (privacy)</text>
    <text x="980" y="494" font-size="13" fill="#43544B">Goal: clone repo → pytest → full</text>
    <text x="980" y="516" font-size="13" fill="#43544B">pipeline verified in two minutes.</text>
  </g>

  <rect x="960" y="640" width="400" height="230" rx="14" fill="#E6F5F3" stroke="#0E8F8C" stroke-width="2"/>
  <rect x="960" y="640" width="400" height="230" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="980" y="674" font-size="16" font-weight="bold" fill="#0E8F8C">THE NORTHWIND CATCH</text>
  <g font-size="14" fill="#2F3D36">
    <text x="980" y="704">Checkout vendor silently changed</text>
    <text x="980" y="730">customer_id: int → string UUID.</text>
    <text x="980" y="760">expect_or_fail fired → pipeline halted,</text>
    <text x="980" y="786">gold table untouched. Quarantine log</text>
    <text x="980" y="812">showed the cause in minutes; fix</text>
    <text x="980" y="838">shipped with a regression test.</text>
  </g>

  <!-- connectors from pyramid to left boxes -->
  <line x1="440" y1="260" x2="560" y2="330" stroke="#93A39A" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="440" y1="520" x2="580" y2="540" stroke="#93A39A" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="440" y1="780" x2="580" y2="740" stroke="#93A39A" stroke-width="1.5" stroke-dasharray="6,4"/>
</svg>