<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#43544B"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0FA968"/>
    </marker>
  <pattern id="ks-pinstripe" width="9" height="9" patternUnits="userSpaceOnUse">
    <path d="M0,9 L9,0" stroke="#0A3527" stroke-width="1.4" stroke-opacity="0.055"/>
  </pattern>
  <pattern id="ks-dotgrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.7" fill="#0A3527" fill-opacity="0.07"/>
  </pattern>
  <filter id="ks-card-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A3527" flood-opacity="0.14"/>
  </filter>
</defs>

  <rect x="0" y="0" width="1400" height="1000" fill="#FFFFFF"/>

  <text x="700" y="52" text-anchor="middle" font-size="34" font-weight="bold" fill="#1a1a1a">Model Serving Architecture</text>
  <rect x="640.0" y="68.0" width="120" height="6" rx="3" fill="#C49A1F" data-ks="title-rule"/><text x="700" y="82" text-anchor="middle" font-size="17" fill="#5A6A60">Open-source LLMs behind one HTTPS endpoint — governed, logged, A/B tested</text>

  <!-- Clients -->
  <rect x="40" y="110" width="460" height="180" rx="14" fill="#F0FAF8" stroke="#0E8F8C" stroke-width="2"/>
  <rect x="40" y="110" width="460" height="180" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="70" y="142" font-size="18" font-weight="bold" fill="#0E8F8C">CLIENTS</text>
  <text x="70" y="164" font-size="14" fill="#7E8B82">Anything that speaks HTTPS</text>
  <g font-size="15" fill="#2F3D36">
    <rect x="60" y="182" width="125" height="86" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="122" y="210" text-anchor="middle" font-weight="bold">Web app</text>
    <text x="122" y="232" text-anchor="middle" font-size="12" fill="#64756C">checkout flow</text>
    <rect x="200" y="182" width="125" height="86" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="262" y="210" text-anchor="middle" font-weight="bold">Mobile</text>
    <text x="262" y="232" text-anchor="middle" font-size="12" fill="#64756C">support chat</text>
    <rect x="340" y="182" width="125" height="86" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="402" y="210" text-anchor="middle" font-weight="bold">Batch</text>
    <text x="402" y="232" text-anchor="middle" font-size="12" fill="#64756C">nightly jobs</text>
  </g>

  <!-- Gateway -->
  <line x1="500" y1="200" x2="552" y2="200" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="560" y="140" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#0E8F8C" stroke-width="2" filter="url(#ks-card-shadow)" data-ks="card"/>
  <text x="660" y="172" text-anchor="middle" font-size="15" font-weight="bold" fill="#2F3D36">API gateway</text>
  <text x="660" y="196" text-anchor="middle" font-size="13" fill="#64756C">auth · rate limits</text>
  <text x="660" y="216" text-anchor="middle" font-size="13" fill="#64756C">OpenAI-compatible</text>

  <!-- Serving endpoint group -->
  <line x1="760" y1="200" x2="940" y2="330" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="330" width="1320" height="380" rx="14" fill="#E9F7F0" stroke="#0FA968" stroke-width="2"/>
  <rect x="40" y="330" width="1320" height="380" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="70" y="362" font-size="18" font-weight="bold" fill="#0FA968">SERVING ENDPOINT — pii-redaction-prod</text>
  <text x="70" y="384" font-size="14" fill="#7E8B82">Runs in your VPC — data never leaves your cloud account</text>

  <g font-size="15" fill="#2F3D36">
    <rect x="70" y="404" width="290" height="110" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="215" y="432" text-anchor="middle" font-weight="bold">Provisioned throughput</text>
    <text x="215" y="456" text-anchor="middle" font-size="13" fill="#64756C">min 0 · max 1200 units</text>
    <text x="215" y="478" text-anchor="middle" font-size="13" fill="#64756C">scale-to-zero overnight</text>

    <rect x="390" y="404" width="290" height="110" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="535" y="432" text-anchor="middle" font-weight="bold">GPU replicas</text>
    <text x="535" y="456" text-anchor="middle" font-size="13" fill="#64756C">Llama 3 8B · optimized</text>
    <text x="535" y="478" text-anchor="middle" font-size="13" fill="#64756C">continuous batching</text>

    <rect x="710" y="404" width="290" height="110" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="855" y="432" text-anchor="middle" font-weight="bold">A/B traffic split</text>
    <text x="855" y="456" text-anchor="middle" font-size="13" fill="#64756C">v3 → 90% · v4 → 10%</text>
    <text x="855" y="478" text-anchor="middle" font-size="13" fill="#64756C">ramp on quality, not vibes</text>

    <rect x="1030" y="404" width="290" height="110" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1175" y="432" text-anchor="middle" font-weight="bold">Guardrails</text>
    <text x="1175" y="456" text-anchor="middle" font-size="13" fill="#64756C">input filter · length caps</text>
    <text x="1175" y="478" text-anchor="middle" font-size="13" fill="#64756C">output JSON validator</text>
  </g>
  <line x1="360" y1="459" x2="386" y2="459" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="459" x2="706" y2="459" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="459" x2="1026" y2="459" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-size="15" fill="#2F3D36">
    <rect x="70" y="544" width="610" height="130" rx="10" fill="#FFFFFF" stroke="#0FA968" stroke-width="1.5" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="375" y="572" text-anchor="middle" font-weight="bold">Inference tables (Delta)</text>
    <text x="375" y="596" text-anchor="middle" font-size="13" fill="#64756C">every request + response logged automatically</text>
    <text x="375" y="618" text-anchor="middle" font-size="13" fill="#64756C">feeds evals · fine-tuning data · debugging</text>
    <text x="375" y="640" text-anchor="middle" font-size="13" fill="#64756C">partitioned by day</text>

    <rect x="710" y="544" width="610" height="130" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1015" y="572" text-anchor="middle" font-weight="bold">Unity Catalog model registry</text>
    <text x="1015" y="596" text-anchor="middle" font-size="13" fill="#64756C">versioned models + adapters</text>
    <text x="1015" y="618" text-anchor="middle" font-size="13" fill="#64756C">rollback = point endpoint at previous version</text>
  </g>
  <line x1="535" y1="514" x2="400" y2="540" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="528" font-size="12" fill="#64756C">logs</text>
  <line x1="1015" y1="540" x2="1015" y2="516" stroke="#0FA968" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="1030" y="532" font-size="12" fill="#0FA968">serves version</text>

  <!-- Ops row -->
  <rect x="40" y="740" width="1320" height="200" rx="14" fill="#F4FAF7" stroke="#B9C7BE" stroke-width="2"/>
  <rect x="40" y="740" width="1320" height="200" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="70" y="772" font-size="18" font-weight="bold" fill="#43544B">OPERATE IT</text>
  <text x="70" y="794" font-size="14" fill="#7E8B82">What to watch once it's live</text>
  <g font-size="15" fill="#2F3D36">
    <rect x="70" y="812" width="400" height="100" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="270" y="842" text-anchor="middle" font-weight="bold">Latency &amp; 429 alerts</text>
    <text x="270" y="866" text-anchor="middle" font-size="13" fill="#64756C">throttling at peak → raise</text>
    <text x="270" y="888" text-anchor="middle" font-size="13" fill="#64756C">the throughput ceiling</text>
    <rect x="500" y="812" width="400" height="100" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="700" y="842" text-anchor="middle" font-weight="bold">GPU cost dashboard</text>
    <text x="700" y="866" text-anchor="middle" font-size="13" fill="#64756C">fixed forecastable bill —</text>
    <text x="700" y="888" text-anchor="middle" font-size="13" fill="#64756C">tag by endpoint &amp; team</text>
    <rect x="930" y="812" width="400" height="100" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1130" y="842" text-anchor="middle" font-weight="bold">A/B quality compare</text>
    <text x="1130" y="866" text-anchor="middle" font-size="13" fill="#64756C">challenger vs stable on</text>
    <text x="1130" y="888" text-anchor="middle" font-size="13" fill="#64756C">logged production traffic</text>
  </g>
</svg>