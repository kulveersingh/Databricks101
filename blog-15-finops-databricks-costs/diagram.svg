<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#43544B"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0B6B4F"/>
    </marker>
  <pattern id="ks-pinstripe" width="9" height="9" patternUnits="userSpaceOnUse">
    <path d="M0,9 L9,0" stroke="#0A3527" stroke-width="1.4" stroke-opacity="0.055"/>
  </pattern>
  <pattern id="ks-dotgrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.7" fill="#0A3527" fill-opacity="0.07"/>
  </pattern>
  <filter id="ks-card-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A3527" flood-opacity="0.14"/>
  </filter>
</defs>

  <rect x="0" y="0" width="1400" height="940" fill="#FFFFFF"/>

  <text x="700" y="52" text-anchor="middle" font-size="34" font-weight="bold" fill="#1a1a1a">Cost Attribution Flow</text>
  <rect x="640.0" y="68.0" width="120" height="6" rx="3" fill="#C49A1F" data-ks="title-rule"/><text x="700" y="82" text-anchor="middle" font-size="17" fill="#5A6A60">You can't optimize what you can't attribute — tag everything, then cut the waste</text>

  <!-- Compute sources -->
  <rect x="40" y="120" width="380" height="480" rx="14" fill="#F4FAF7" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="40" y="120" width="380" height="480" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="70" y="152" font-size="18" font-weight="bold" fill="#1a1a1a">COMPUTE (DBU SOURCES)</text>
  <text x="70" y="174" font-size="14" fill="#7E8B82">same VM, different DBU rate by workload</text>
  <g font-size="14" fill="#2F3D36">
    <rect x="70" y="196" width="320" height="66" rx="10" fill="#E9F7F0" stroke="#0FA968"/>
    <text x="230" y="220" text-anchor="middle" font-weight="bold">All-purpose clusters</text>
    <text x="230" y="242" text-anchor="middle" font-size="12" fill="#64756C">highest DBU rate · interactive</text>
    <rect x="70" y="276" width="320" height="66" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="230" y="300" text-anchor="middle" font-weight="bold">Job clusters</text>
    <text x="230" y="322" text-anchor="middle" font-size="12" fill="#64756C">lower rate · ephemeral</text>
    <rect x="70" y="356" width="320" height="66" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="230" y="380" text-anchor="middle" font-weight="bold">DLT pipelines</text>
    <text x="230" y="402" text-anchor="middle" font-size="12" fill="#64756C">lowest classic rate</text>
    <rect x="70" y="436" width="320" height="66" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="230" y="460" text-anchor="middle" font-weight="bold">SQL warehouses</text>
    <text x="230" y="482" text-anchor="middle" font-size="12" fill="#64756C">BI-optimized · right-size these</text>
    <rect x="70" y="516" width="320" height="66" rx="10" fill="#E9F7F0" stroke="#0B6B4F"/>
    <text x="230" y="540" text-anchor="middle" font-weight="bold">Serverless</text>
    <text x="230" y="562" text-anchor="middle" font-size="12" fill="#64756C">premium rate · zero idle waste</text>
  </g>

  <!-- Usage + tagging -->
  <rect x="470" y="120" width="440" height="480" rx="14" fill="#E6F5F3" stroke="#0E8F8C" stroke-width="2"/>
  <rect x="470" y="120" width="440" height="480" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="500" y="152" font-size="18" font-weight="bold" fill="#0E8F8C">METERING &amp; ATTRIBUTION</text>
  <text x="500" y="174" font-size="14" fill="#7E8B82">raw spend becomes explainable spend</text>
  <g font-size="14" fill="#2F3D36">
    <rect x="500" y="196" width="380" height="96" rx="10" fill="#FFFFFF" stroke="#0E8F8C" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="690" y="222" text-anchor="middle" font-weight="bold">system.billing.usage</text>
    <text x="690" y="244" text-anchor="middle" font-size="12" fill="#64756C">every DBU, by SKU, cluster, user</text>
    <text x="690" y="262" text-anchor="middle" font-size="12" fill="#64756C">queryable Delta table — no agents</text>
    <rect x="500" y="312" width="380" height="96" rx="10" fill="#FFFFFF" stroke="#0E8F8C" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="690" y="338" text-anchor="middle" font-weight="bold">Enforced tagging</text>
    <text x="690" y="360" text-anchor="middle" font-size="12" fill="#64756C">cost_center · team · project</text>
    <text x="690" y="378" text-anchor="middle" font-size="12" fill="#64756C">required via cluster policy; untagged = bug</text>
    <rect x="500" y="428" width="380" height="96" rx="10" fill="#FFFFFF" stroke="#0E8F8C" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="690" y="454" text-anchor="middle" font-weight="bold">Attribution dashboard</text>
    <text x="690" y="476" text-anchor="middle" font-size="12" fill="#64756C">"ML project cost $11k" = a query,</text>
    <text x="690" y="494" text-anchor="middle" font-size="12" fill="#64756C">not a guess</text>
  </g>
  <line x1="690" y1="292" x2="690" y2="310" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="408" x2="690" y2="426" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Guardrails + actions -->
  <rect x="960" y="120" width="400" height="480" rx="14" fill="#FAF0D7" stroke="#C49A1F" stroke-width="2"/>
  <rect x="960" y="120" width="400" height="480" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="990" y="152" font-size="18" font-weight="bold" fill="#8F6E14">GUARDRAILS &amp; ACTIONS</text>
  <text x="990" y="174" font-size="14" fill="#7E8B82">discipline beats clever tuning</text>
  <g font-size="14" fill="#2F3D36">
    <rect x="990" y="196" width="340" height="96" rx="10" fill="#FFFFFF" stroke="#C49A1F" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1160" y="222" text-anchor="middle" font-weight="bold">Cluster policies</text>
    <text x="1160" y="244" text-anchor="middle" font-size="12" fill="#64756C">max workers · instance allowlist</text>
    <text x="1160" y="262" text-anchor="middle" font-size="12" fill="#64756C">auto-terminate 30 min · spot</text>
    <rect x="990" y="312" width="340" height="96" rx="10" fill="#FFFFFF" stroke="#C49A1F" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1160" y="338" text-anchor="middle" font-weight="bold">Budgets &amp; alerts</text>
    <text x="1160" y="360" text-anchor="middle" font-size="12" fill="#64756C">alerts at 50 / 80 / 100% of target</text>
    <text x="1160" y="378" text-anchor="middle" font-size="12" fill="#64756C">the 50% alert is the useful one</text>
    <rect x="990" y="428" width="340" height="96" rx="10" fill="#FFFFFF" stroke="#C49A1F" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1160" y="454" text-anchor="middle" font-weight="bold">Right-sizing loop</text>
    <text x="1160" y="476" text-anchor="middle" font-size="12" fill="#64756C">autoscale bounds · Photon only where</text>
    <text x="1160" y="494" text-anchor="middle" font-size="12" fill="#64756C">it earns its premium · kill idle</text>
  </g>

  <!-- arrows across -->
  <line x1="420" y1="360" x2="465" y2="360" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="910" y1="360" x2="955" y2="360" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Northwind result -->
  <rect x="40" y="640" width="1320" height="240" rx="14" fill="#E9F7F0" stroke="#0B6B4F" stroke-width="2"/>
  <rect x="40" y="640" width="1320" height="240" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="70" y="676" font-size="18" font-weight="bold" fill="#0B6B4F">NORTHWIND: $30k/mo → $12k/mo — THE ORDER THEY DID IT</text>
  <g font-size="15" fill="#2F3D36">
    <rect x="70" y="696" width="290" height="150" rx="10" fill="#FFFFFF" stroke="#0B6B4F" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="215" y="724" text-anchor="middle" font-weight="bold">1 · Attribute</text>
    <text x="215" y="750" text-anchor="middle" font-size="12" fill="#64756C">enforce tags, dashboard on</text>
    <text x="215" y="768" text-anchor="middle" font-size="12" fill="#64756C">billing.usage → found 40%</text>
    <text x="215" y="786" text-anchor="middle" font-size="12" fill="#64756C">was idle interactive clusters</text>
    <text x="215" y="812" text-anchor="middle" font-size="13" font-weight="bold" fill="#0B6B4F">insight, not savings yet</text>
    <rect x="390" y="696" width="290" height="150" rx="10" fill="#FFFFFF" stroke="#0B6B4F" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="535" y="724" text-anchor="middle" font-weight="bold">2 · Kill the idle</text>
    <text x="535" y="750" text-anchor="middle" font-size="12" fill="#64756C">30-min auto-terminate by policy</text>
    <text x="535" y="768" text-anchor="middle" font-size="12" fill="#64756C">delete always-on dev cluster</text>
    <text x="535" y="812" text-anchor="middle" font-size="13" font-weight="bold" fill="#0B6B4F">≈ $8k/mo saved</text>
    <rect x="710" y="696" width="290" height="150" rx="10" fill="#FFFFFF" stroke="#0B6B4F" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="855" y="724" text-anchor="middle" font-weight="bold">3 · Right-size jobs</text>
    <text x="855" y="750" text-anchor="middle" font-size="12" fill="#64756C">autoscale bounds, spot instances</text>
    <text x="855" y="768" text-anchor="middle" font-size="12" fill="#64756C">serverless for short bursty jobs</text>
    <text x="855" y="812" text-anchor="middle" font-size="13" font-weight="bold" fill="#0B6B4F">≈ $5k/mo saved</text>
    <rect x="1030" y="696" width="300" height="150" rx="10" fill="#FFFFFF" stroke="#0B6B4F" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1180" y="724" text-anchor="middle" font-weight="bold">4 · Audit premiums</text>
    <text x="1180" y="750" text-anchor="middle" font-size="12" fill="#64756C">Photon only where faster;</text>
    <text x="1180" y="768" text-anchor="middle" font-size="12" fill="#64756C">right-size SQL warehouses</text>
    <text x="1180" y="812" text-anchor="middle" font-size="13" font-weight="bold" fill="#0B6B4F">≈ $5k/mo saved</text>
  </g>
  <line x1="360" y1="771" x2="385" y2="771" stroke="#0B6B4F" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="680" y1="771" x2="705" y2="771" stroke="#0B6B4F" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="1000" y1="771" x2="1025" y2="771" stroke="#0B6B4F" stroke-width="2" marker-end="url(#arrowGreen)"/>
</svg>