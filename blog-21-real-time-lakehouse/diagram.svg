<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="DejaVu Sans, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#43544B"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0FA968"/>
    </marker>
  <pattern id="ks-pinstripe" width="9" height="9" patternUnits="userSpaceOnUse">
    <path d="M0,9 L9,0" stroke="#0A3527" stroke-width="1.4" stroke-opacity="0.055"/>
  </pattern>
  <pattern id="ks-dotgrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.7" fill="#0A3527" fill-opacity="0.07"/>
  </pattern>
  <filter id="ks-card-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0A3527" flood-opacity="0.14"/>
  </filter>
</defs>

  <rect x="0" y="0" width="1400" height="1000" fill="#FFFFFF"/>

  <text x="700" y="52" text-anchor="middle" font-size="34" font-weight="bold" fill="#1a1a1a">Real-Time Lakehouse: End to End</text>
  <rect x="640.0" y="68.0" width="120" height="6" rx="3" fill="#C49A1F" data-ks="title-rule"/><text x="700" y="82" text-anchor="middle" font-size="17" fill="#5A6A60">Kafka → DLT → Feature Store → sub-100ms serving: a personalized pricing engine</text>

  <!-- Flow row -->
  <g font-size="14" fill="#2F3D36">
    <rect x="40" y="120" width="230" height="220" rx="12" fill="#F0FAF8" stroke="#0E8F8C" stroke-width="2"/>
    <rect x="40" y="120" width="230" height="220" rx="12" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="155" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#0E8F8C">KAFKA</text>
    <text x="155" y="176" text-anchor="middle" font-size="13" fill="#64756C">ingest · ~50k ev/s peak</text>
    <text x="155" y="206" text-anchor="middle">product views</text>
    <text x="155" y="230" text-anchor="middle">cart adds · purchases</text>
    <text x="155" y="254" text-anchor="middle">inventory updates</text>
    <text x="155" y="292" text-anchor="middle" font-size="13" fill="#64756C">durable · replayable log</text>
    <text x="155" y="314" text-anchor="middle" font-size="13" fill="#64756C">buffers 8x flash-sale bursts</text>

    <rect x="310" y="120" width="300" height="220" rx="12" fill="#E9F7F0" stroke="#0FA968" stroke-width="2"/>
    <rect x="310" y="120" width="300" height="220" rx="12" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="460" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#0FA968">DELTA LIVE TABLES</text>
    <text x="460" y="176" text-anchor="middle" font-size="13" fill="#64756C">process · exactly-once</text>
    <text x="460" y="206" text-anchor="middle">bronze: raw events</text>
    <text x="460" y="230" text-anchor="middle">silver: validated</text>
    <text x="460" y="254" text-anchor="middle" font-size="13" fill="#64756C">(expectations reject bad rows)</text>
    <text x="460" y="284" text-anchor="middle">gold: 15-min demand velocity</text>
    <text x="460" y="314" text-anchor="middle" font-size="13" fill="#64756C">checkpoints · autoscaling</text>

    <rect x="650" y="120" width="300" height="220" rx="12" fill="#E6F5F3" stroke="#0B6E6B" stroke-width="2"/>
    <rect x="650" y="120" width="300" height="220" rx="12" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="800" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#0B6E6B">FEATURE STORE</text>
    <text x="800" y="176" text-anchor="middle" font-size="13" fill="#64756C">fresh state · ms lookups</text>
    <text x="800" y="206" text-anchor="middle">offline: Delta (training)</text>
    <text x="800" y="230" text-anchor="middle">online: low-latency store</text>
    <text x="800" y="254" text-anchor="middle" font-size="13" fill="#64756C">price sensitivity · demand</text>
    <text x="800" y="276" text-anchor="middle" font-size="13" fill="#64756C">velocity · inventory depth</text>
    <text x="800" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#0B6E6B">lookup p99 ≈ 8 ms</text>

    <rect x="990" y="120" width="370" height="220" rx="12" fill="#F4FAF7" stroke="#0FA968" stroke-width="2"/>
    <rect x="990" y="120" width="370" height="220" rx="12" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="1175" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#0FA968">MODEL SERVING</text>
    <text x="1175" y="176" text-anchor="middle" font-size="13" fill="#64756C">decide · sub-100ms</text>
    <text x="1175" y="206" text-anchor="middle">pricing model scores</text>
    <text x="1175" y="230" text-anchor="middle">price multiplier</text>
    <rect x="1020" y="248" width="310" height="44" rx="8" fill="#FAF0D7" stroke="#8F6E14"/>
    <text x="1175" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#8F6E14">rule clamp: ±15% · ≥ cost</text>
    <text x="1175" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#0FA968">end-to-end p99 ≈ 65 ms</text>
  </g>
  <line x1="270" y1="230" x2="306" y2="230" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="230" x2="646" y2="230" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="950" y1="230" x2="986" y2="230" stroke="#43544B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Latency budget bar -->
  <rect x="40" y="370" width="1320" height="120" rx="12" fill="#F4FAF7" stroke="#B9C7BE" stroke-width="1.5"/>
  <rect x="40" y="370" width="1320" height="120" rx="12" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="70" y="402" font-size="16" font-weight="bold" fill="#43544B">LATENCY BUDGET — 100 ms</text>
  <rect x="70" y="418" width="120" height="34" rx="6" fill="#0E8F8C"/>
  <text x="130" y="441" text-anchor="middle" font-size="13" fill="#FFFFFF">network ~10ms</text>
  <rect x="196" y="418" width="120" height="34" rx="6" fill="#0B6E6B"/>
  <text x="256" y="441" text-anchor="middle" font-size="13" fill="#FFFFFF">features ~8ms</text>
  <rect x="322" y="418" width="420" height="34" rx="6" fill="#0FA968"/>
  <text x="532" y="441" text-anchor="middle" font-size="13" fill="#FFFFFF">inference ~30–60ms</text>
  <rect x="748" y="418" width="200" height="34" rx="6" fill="#DCE5DF"/>
  <text x="848" y="441" text-anchor="middle" font-size="13" fill="#5A6A60">headroom</text>
  <text x="1330" y="441" text-anchor="end" font-size="13" fill="#5A6A60">p99 ≈ 65 ms</text>

  <!-- Guarantees -->
  <rect x="40" y="520" width="1320" height="200" rx="14" fill="#E9F7F0" stroke="#0FA968" stroke-width="2"/>
  <rect x="40" y="520" width="1320" height="200" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="70" y="552" font-size="18" font-weight="bold" fill="#0FA968">THE TWO GUARANTEES</text>
  <g font-size="14" fill="#2F3D36">
    <rect x="70" y="570" width="620" height="120" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="380" y="600" text-anchor="middle" font-weight="bold">Exactly-once</text>
    <text x="380" y="624" text-anchor="middle" font-size="13" fill="#64756C">Kafka offsets in DLT checkpoints</text>
    <text x="380" y="646" text-anchor="middle" font-size="13" fill="#64756C">+ idempotent Delta writes</text>
    <text x="380" y="668" text-anchor="middle" font-size="13" fill="#64756C">test: kill a cluster mid-run, verify silver</text>
    <rect x="720" y="570" width="610" height="120" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1025" y="600" text-anchor="middle" font-weight="bold">Backpressure</text>
    <text x="1025" y="624" text-anchor="middle" font-size="13" fill="#64756C">consumer-lag alerts = early warning</text>
    <text x="1025" y="646" text-anchor="middle" font-size="13" fill="#64756C">DLT autoscaling + small micro-batches</text>
    <text x="1025" y="668" text-anchor="middle" font-size="13" fill="#64756C">design for 5–10x bursts</text>
  </g>

  <!-- Ops -->
  <rect x="40" y="750" width="1320" height="200" rx="14" fill="#F4FAF7" stroke="#B9C7BE" stroke-width="2"/>
  <rect x="40" y="750" width="1320" height="200" rx="14" fill="url(#ks-pinstripe)" data-ks="texture" pointer-events="none"/><text x="70" y="782" font-size="18" font-weight="bold" fill="#43544B">OPERATE IT — ONE DASHBOARD, FOUR SIGNALS</text>
  <g font-size="14" fill="#2F3D36">
    <rect x="70" y="800" width="300" height="110" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="220" y="830" text-anchor="middle" font-weight="bold">Kafka consumer lag</text>
    <text x="220" y="854" text-anchor="middle" font-size="13" fill="#64756C">alert on sustained growth,</text>
    <text x="220" y="876" text-anchor="middle" font-size="13" fill="#64756C">not absolute values</text>
    <rect x="400" y="800" width="300" height="110" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="550" y="830" text-anchor="middle" font-weight="bold">Freshness SLO</text>
    <text x="550" y="854" text-anchor="middle" font-size="13" fill="#64756C">"features ≤ 5 min stale" —</text>
    <text x="550" y="876" text-anchor="middle" font-size="13" fill="#64756C">measured continuously</text>
    <rect x="730" y="800" width="300" height="110" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="880" y="830" text-anchor="middle" font-weight="bold">Online store health</text>
    <text x="880" y="854" text-anchor="middle" font-size="13" fill="#64756C">hit rate · lookup p99 ·</text>
    <text x="880" y="876" text-anchor="middle" font-size="13" fill="#64756C">offline→online lag</text>
    <rect x="1060" y="800" width="300" height="110" rx="10" fill="#FFFFFF" stroke="#D5E0D9" filter="url(#ks-card-shadow)" data-ks="card"/>
    <text x="1210" y="830" text-anchor="middle" font-weight="bold">Serving vitals</text>
    <text x="1210" y="854" text-anchor="middle" font-size="13" fill="#64756C">req rate · inference p99 ·</text>
    <text x="1210" y="876" text-anchor="middle" font-size="13" fill="#64756C">errors · 429 throttles</text>
  </g>
</svg>